[project]
name = "esp32-rsvp-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
    "pyphen>=0.14",
]

[project.scripts]
rsvp = "rsvp_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rsvp_cli", "make_book", "epub_import"]
